name: "Frontal Upgrade Risk"
description: "Posts breaking changes and the exact code that uses them on Dependabot and Renovate PRs."
author: "Frontal Labs"
branding:
  icon: "shield"
  color: "purple"

inputs:
  github-token:
    description: "Token used to read the PR and post the comment. Dependabot PRs need a Dependabot secret (see README). Defaults to the workflow's GITHUB_TOKEN."
    required: false
    default: ""
  fail-on:
    description: "Fail the job when the overall risk is at or above this level: none, review or risky."
    required: false
    default: "none"
  comment:
    description: "Post or update the sticky PR comment."
    required: false
    default: "true"
  force:
    description: "Analyze PRs from any author, not only dependency bots."
    required: false
    default: "false"
  tags:
    description: "Path to a JSON file that overrides labels from config/tags.json. Empty uses the defaults."
    required: false
    default: ""
  llm-api-key:
    description: "Anthropic API key. Enables LLM extraction for release notes the rules cannot parse."
    required: false
    default: ""
  llm-model:
    description: "Model used with llm-api-key."
    required: false
    default: "claude-sonnet-5-5"

outputs:
  risk:
    description: "Overall risk level: safe, review, unknown or risky. Empty when the PR is skipped."
    value: ${{ steps.run.outputs.risk }}
  report-path:
    description: "Path to the risk.json file written for this run."
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3.14"

    # The action runs from its own checkout, so install its dependencies and
    # build the bundled entrypoint when they are missing. dist/ is gitignored,
    # so it cannot ship in the release tag.
    - name: Prepare Upgrade Risk
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH"
        if [ ! -d node_modules/@octokit ]; then
          bun install --frozen-lockfile --production
        fi
        if [ ! -f dist/index.js ]; then
          bun run build
        fi

    - name: Run Upgrade Risk
      id: run
      shell: bash
      env:
        # GitHub's node24 runner exposes with: inputs as INPUT_<NAME> env vars;
        # the composite reproduces that so action.ts reads the workflow values
        # instead of its hardcoded fallbacks.
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token || env.GITHUB_TOKEN }}
        INPUT_FAIL-ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_LLM-API-KEY: ${{ inputs.llm-api-key }}
        INPUT_LLM-MODEL: ${{ inputs.llm-model }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "$ACTION_PATH/dist/index.js"
